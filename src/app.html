<meta charset="utf-8">
<title>Odyssey Map</title>
<style>
/*__FONTS__*/
:root{
  color-scheme:dark;
  --ink:#0e0c09;
  --panel:rgba(14,12,9,.84);
  --panel-hi:rgba(14,12,9,.94);
  --panel-solid:#14110c;
  --raise:#1d1812;
  --line:rgba(217,178,95,.22);
  --line-strong:rgba(217,178,95,.5);
  --gold:#d9b25f;
  --gold-hi:#f2d891;
  --gold-dim:#a18541;
  --parch:#efe3c4;
  --parch-dim:#bdae88;
  --muted:#8e8265;
  --fog:#1c2a2d;
  --f-display:'GFS Didot','Cormorant SC',Georgia,serif;
  --f-caps:'Cormorant SC','GFS Didot',Georgia,serif;
  --f-text:'Alegreya',Georgia,serif;
  --f-ui:'Alegreya Sans',system-ui,sans-serif;
  --panelW:300px;
  --bottomH:70px;
  --strip:50px;
  --dock:0px;
  --hit:34px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:var(--ink);color:var(--parch);font-family:var(--f-ui);font-size:15px;line-height:1.35;overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#map:focus-visible{outline-offset:-3px}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--fog)}

/* map */
#map{position:absolute;inset:0;z-index:0;isolation:isolate;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.grabbing{cursor:grabbing}
#map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 55% 40%,rgba(210,245,240,.09) 0,transparent 55%),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(9,22,28,.3) 100%)}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin,.apin,.bu,.lbl,.rlab{position:absolute;left:0;top:0;will-change:transform}
.pin,.apin{pointer-events:auto}
.pin{width:var(--hit);height:var(--hit);margin:calc(var(--hit)/-2) 0 0 calc(var(--hit)/-2);display:grid;place-items:center;border-radius:50%}
.pin svg{width:23px;height:23px;display:block;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(10,6,2,.6));transition:transform .15s,opacity .2s}
.pin:hover svg{transform:scale(1.14)}
.pin.dim svg{opacity:.35;filter:none}
.pin.first svg{width:30px;height:30px}
.pin.sel svg{transform:scale(1.3);filter:drop-shadow(0 0 5px #ffe9a8) drop-shadow(0 1px 2px rgba(10,6,2,.8))}
.pin.cant svg{filter:drop-shadow(0 0 4px #ffe9a8) drop-shadow(0 0 1px #fff3c8)}
.pin.sel::after,.pin.cant::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,233,168,.9);animation:ring 2.4s ease-out infinite;pointer-events:none}
.pin.cant::after{animation-duration:3.2s;border-color:rgba(255,233,168,.7)}
@keyframes ring{0%{transform:scale(.5);opacity:.95}100%{transform:scale(1.5);opacity:0}}
.pin.ithaca svg{width:32px;height:32px}
.pin.ithaca::before{content:"";position:absolute;width:42px;height:42px;border-radius:50%;border:2px solid rgba(242,216,145,.55);pointer-events:none}
.pin.ithaca.sel::after{display:none}
.lbl{pointer-events:none;white-space:nowrap;font:600 12.5px/16px var(--f-text);color:#241708;
  text-shadow:0 0 1px #f6ecd0,0 0 2px #f6ecd0,0 0 3px #f6ecd0,0 0 6px rgba(246,236,208,.85);opacity:0;transition:opacity .15s}
.lbl.on{opacity:1}
.lbl.big{font-size:14px;line-height:18px}
.lbl.ithaca{font:400 20px/24px var(--f-display);letter-spacing:.05em;color:#120a02;-webkit-text-stroke:.35px #120a02;text-shadow:0 0 1px #fbf3dc,0 0 2px #fbf3dc,0 0 4px #fbf3dc,0 0 8px rgba(251,243,220,.95)}
.pin.sm svg{width:16px;height:16px}
.pin.ithaca.low svg{width:20px;height:20px}
.pin.ithaca.low::before,.pin.ithaca.low::after{display:none}
.ship{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;pointer-events:none;z-index:2000}
.ship svg{display:block;width:16px;height:16px;overflow:visible}
.lbl.alt{font-style:italic;font-weight:600;color:#2c1c0a}
.bu{display:flex;pointer-events:none}
.bdg{height:17px;min-width:17px;padding:0 5px;margin-left:-1px;border-radius:9px;font:700 10.5px/15px var(--f-ui);text-align:center;color:var(--tc);background:var(--c);border:1px solid #fff4d6;box-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap;cursor:pointer;pointer-events:auto}
.bdg:first-child{margin-left:0}
.bdg.inv{background:#f7f0e2;color:#2a2036;border:1px dashed var(--c)}
.bdg.cur{box-shadow:0 0 0 2px #fff,0 0 8px 2px var(--c)}
.rlab{pointer-events:none;height:18px;padding:0 7px;border-radius:9px;font:600 11px/18px var(--f-ui);background:var(--c);color:var(--tc);border:1px solid #fff4d6;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.45)}
.apin{width:30px;height:30px;margin:-15px 0 0 -15px;display:grid;place-items:center}
.apin i{display:block;width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--gold-hi);background:rgba(20,14,6,.55);box-shadow:0 0 0 1.5px rgba(14,9,4,.8)}

/* side panel */
#side{position:absolute;left:0;top:0;bottom:0;width:var(--panelW);z-index:30;background:rgba(14,12,9,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-right:1px solid var(--line-strong);box-shadow:6px 0 28px rgba(5,10,12,.35);display:flex;flex-direction:column;min-height:0}
.brand{height:56px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.brand h1{font:400 24px/1 var(--f-display);color:var(--gold-hi);letter-spacing:.01em;white-space:nowrap}
.search{padding:10px 14px 8px;position:relative;flex:none}
.search input{width:100%;height:34px;background:#0b0907;border:1px solid var(--line-strong);color:var(--parch);font:400 15px var(--f-ui);padding:0 32px 0 10px;border-radius:2px}
.search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:14px;top:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--gold-dim);font-size:20px}
.tabs{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.tabs button.tb{padding:8px 4px 7px;margin-right:14px;font:600 14px/1 var(--f-caps);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:34px}
.tabs button.tb[aria-selected=true]{color:var(--gold-hi);border-bottom-color:var(--gold)}
.tabs button.tb[aria-disabled=true]{opacity:.4;cursor:default}
.tabs .t-leg{display:none}
.tabs .link{margin-left:auto}
.link{white-space:nowrap;font:500 12px var(--f-ui);color:var(--gold);text-decoration:underline;text-underline-offset:3px;min-height:26px;padding:2px 0}
.pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 0 12px;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
.pbody::-webkit-scrollbar{width:7px}
.pbody::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px}
.more-below{-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.hint{font:400 12px/1.3 var(--f-ui);color:var(--parch-dim);padding:7px 16px 2px}
.hint .link{font-size:12px;min-height:0;padding:0}
.grp{font:600 12.5px/26px var(--f-caps);height:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);padding:0 16px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.crow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;height:36px;position:relative;padding-right:14px}
.crow.focus{background:rgba(217,178,95,.12)}
.crow.focus::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--gold)}
.crow:hover{background:rgba(217,178,95,.07)}
.sw{width:44px;height:36px;display:grid;place-items:center}
.sw i{width:18px;height:18px;border-radius:50%;border:2px solid var(--c);box-shadow:inset 0 0 0 0 var(--c);transition:box-shadow .15s,background .15s}
.sw:hover i{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sw[aria-pressed=true] i{box-shadow:inset 0 0 0 9px var(--c),0 0 0 2px rgba(0,0,0,.4);background:none}
.cmain{height:36px;display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden;padding-top:8px}
.cn{font:500 15px/20px var(--f-text);color:var(--parch);white-space:nowrap}
.cn small{font:italic 400 12px var(--f-text);color:var(--muted);margin-left:5px}
.cr{font:400 12px/20px var(--f-ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cm{font:500 12px var(--f-ui);color:var(--muted);text-align:right;min-width:16px}

/* itinerary */
.rv{padding:8px 18px 0}
.rv-head{display:flex;gap:12px;align-items:center;margin:6px 0 8px}
.rv-head .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.5);flex:none}
.rv-head h2{font:400 24px/1.05 var(--f-display);color:var(--gold-hi)}
.rv-head p{font:italic 400 14.5px var(--f-text);color:var(--parch-dim);margin-top:2px}
.rv .sum{font:400 15.5px/1.4 var(--f-text);color:var(--parch)}
.kpis{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.kpi{border:1px solid var(--line);padding:5px 9px;min-width:0;flex:1 1 auto}
.kpi b{display:block;font:500 16px/1.1 var(--f-text);color:var(--gold-hi)}
.kpi span{font:600 11px/1.2 var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:40px;width:100%;border:1px solid var(--gold);color:var(--gold-hi);font:600 14.5px var(--f-caps);letter-spacing:.14em;text-transform:uppercase;background:rgba(217,178,95,.08);text-align:center;padding:0 12px}
.btn:hover{background:rgba(217,178,95,.18)}
.btn svg{width:13px;height:13px;fill:currentColor}
.callout{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(217,178,95,.08);font:400 14px/1.4 var(--f-text);color:var(--parch)}
.callout b{font:600 11.5px var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px}
.callout.inv{border-left-color:#b9a7d8;background:rgba(185,167,216,.1)}
.callout.inv b{color:#cfc0ea}
.fate{margin:10px 0 4px;font:400 14.5px/1.4 var(--f-text);color:var(--parch-dim)}
.fate b{font:600 11.5px var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);margin-right:6px}
details.more summary{cursor:pointer;font:500 13.5px var(--f-ui);color:var(--gold);min-height:36px;display:flex;align-items:center;margin-top:4px}
.stops{margin:12px 0 0;position:relative}
.stops li{position:relative}
.stops li::before{content:"";position:absolute;left:14px;top:30px;bottom:-4px;width:2px;background:var(--c);opacity:.35}
.stops li:last-child::before{display:none}
.stop{display:grid;grid-template-columns:30px 1fr;gap:10px;width:100%;padding:7px 6px 9px 0;min-height:44px;border-radius:2px;position:relative}
.stop:hover{background:rgba(217,178,95,.07)}
.stop.cur{background:rgba(217,178,95,.14)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--tc);font:700 14px var(--f-ui);border:2px solid rgba(255,255,255,.55);position:relative;z-index:1}
.inv .num{background:var(--panel-solid);color:#d9cdee;border:2px dashed var(--c)}
.s-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.s-name{font:500 16.5px/1.2 var(--f-text);color:var(--parch);display:flex;gap:7px;align-items:center}
.s-name svg{width:12px;height:12px;flex:none}
.s-leg{font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap}
.s-meta{font:500 12.5px var(--f-ui);color:var(--gold-dim);margin-top:1px}
.s-note{font:400 14.5px/1.38 var(--f-text);color:var(--parch-dim);margin-top:3px}
.s-ships{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--f-ui);color:var(--parch-dim);margin-top:4px}
.s-ships svg{width:15px;height:12px}
.empty{padding:18px;font:italic 400 15px/1.45 var(--f-text);color:var(--muted)}

/* search */
.res{padding:6px 0}
.res button{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;width:100%;min-height:46px;padding:5px 16px 5px 14px}
.res button:hover,.res button:focus-visible{background:rgba(217,178,95,.12)}
.res .rl{font:500 16px/1.15 var(--f-text);color:var(--parch)}
.res .rs{display:block;font:400 12.5px/1.2 var(--f-ui);color:var(--muted)}
.res .tag{font:600 11px var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim)}
.res .ic svg{width:16px;height:16px;display:block}
.res .ic i{display:block;width:12px;height:12px;border-radius:50%;background:var(--c);margin:auto}

/* card */
#card{position:absolute;right:16px;top:24px;width:360px;max-height:calc(100% - 262px);z-index:40;background:var(--panel-hi);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line-strong);box-shadow:0 14px 40px rgba(4,8,10,.5),inset 0 0 0 4px var(--panel-solid),inset 0 0 0 5px var(--line);overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 22px;animation:cardin .25s ease-out;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#card .x{position:absolute;right:6px;top:6px;width:44px;height:44px;display:grid;place-items:center;font-size:26px;line-height:1;color:var(--gold);z-index:2}
#card .x:hover{color:var(--gold-hi)}
.cgrab{display:none}
.seal{display:inline-flex;align-items:center;gap:9px;padding:4px 12px 4px 8px;border:1px solid var(--line-strong);font:600 13px var(--f-caps);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);background:rgba(217,178,95,.08)}
.seal svg{width:18px;height:18px;display:block}
.eyebrow{font:600 13.5px var(--f-caps);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px}
#card h2{font:400 29px/1.08 var(--f-display);color:var(--gold-hi);margin:10px 44px 0 0}
#card h2.c{margin-top:2px}
.aka{font:italic 400 16px var(--f-text);color:var(--parch-dim);margin-top:3px}
.modern{font:500 14px var(--f-ui);color:var(--parch-dim);margin-top:7px;display:flex;gap:7px;align-items:baseline}
.modern::before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex:none;position:relative;top:-1px}
.gloss{font:italic 400 14px/1.4 var(--f-text);color:var(--muted);margin-top:9px}
.desc{font:400 16.5px/1.48 var(--f-text);color:var(--parch);margin-top:12px}
#card h3{font:600 13px/1 var(--f-caps);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin:16px 0 7px;display:flex;align-items:center;gap:10px}
#card h3::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:3px 10px;border:1px solid var(--line-strong);font:500 14px var(--f-ui);color:var(--parch);background:rgba(255,255,255,.035)}
.chip:hover{background:rgba(217,178,95,.16)}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.4);flex:none}
.chip svg{width:13px;height:13px;flex:none}
.alts li button{display:flex;gap:9px;align-items:center;min-height:34px;width:100%;padding:3px 2px;font:400 15px/1.25 var(--f-text);color:var(--parch)}
.alts li button:hover{color:var(--gold-hi)}
.alts li button::before{content:"";width:8px;height:8px;border:2px solid var(--gold-hi);transform:rotate(45deg);flex:none}
.cnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.cnav button{flex:1;min-height:40px;border:1px solid var(--line-strong);padding:0 10px;font:600 13.5px var(--f-caps);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-align:center}
.cnav button:hover{background:rgba(217,178,95,.14)}
.cnav button[disabled]{opacity:.3;cursor:default}
.back{font:500 13px var(--f-ui);color:var(--gold);text-decoration:underline;text-underline-offset:3px;min-height:28px;display:inline-block;margin-bottom:4px}

/* bottom strip */
#bottom{position:absolute;left:calc(var(--panelW) + 16px);right:16px;bottom:16px;height:var(--bottomH);z-index:12;background:rgba(14,12,9,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line-strong);box-shadow:0 6px 24px rgba(4,8,10,.4);display:flex;flex-direction:column}
#legend{height:28px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
#legend .lgg{display:flex;align-items:center;gap:14px}
#legend .lgg+.lgg{border-left:1px solid var(--line-strong);padding-left:14px}
#legend h4{display:none}
#legend ul{display:flex;gap:14px;align-items:center}
.lg li{display:flex;gap:6px;align-items:center;font:400 12px/1 var(--f-ui);color:var(--parch);white-space:nowrap}
.lg li svg{width:28px;height:14px;flex:none;overflow:visible}
.lg li svg.pn{width:16px;height:16px;margin:0}
.credit{margin-left:auto;font:400 11px/1 var(--f-ui);color:var(--muted);white-space:nowrap}
#cantos{height:40px;flex:1;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
#cantos::-webkit-scrollbar{display:none}
.cb{flex:1 0 36px;min-width:36px;text-align:center;font:500 13px var(--f-text);color:var(--parch-dim);position:relative;border-right:1px solid rgba(217,178,95,.1)}
.cb:last-child{border-right:0}
.cb:hover{background:rgba(217,178,95,.12);color:var(--parch)}
.cb[aria-pressed=true]{background:var(--gold);color:#1a1208;font-weight:700}
.cb.has::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;background:var(--gold-hi);transform:rotate(45deg)}
.cb[aria-pressed=true].has::after{background:#1a1208}

/* controls */
#zoomctl{position:absolute;right:16px;bottom:calc(var(--bottomH) + 28px);z-index:12;display:flex;align-items:flex-end;gap:10px}
#zbtns{display:flex;flex-direction:column;align-items:flex-end}
.zb{width:36px;height:36px;display:grid;place-items:center;background:var(--panel-hi);border:1px solid var(--line-strong);color:var(--gold-hi);font:400 22px/1 var(--f-text);text-align:center}
.zb:hover{background:var(--raise)}
.zb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.zb[data-act=zout]{margin-top:-1px}
.zb[data-act=home]{margin-top:6px}
#scale{display:flex;flex-direction:column;align-items:flex-end;padding-bottom:2px;font:600 11px var(--f-caps);letter-spacing:.14em;color:#fbf3dc;text-shadow:0 0 3px #10242a,0 0 3px #10242a;text-transform:uppercase}
#scale i{display:block;height:6px;border:2px solid #fbf3dc;border-top:0;box-shadow:0 1px 2px rgba(0,0,0,.6);margin-top:2px}

/* playback */
#playbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);width:min(520px,100%);background:#14110c;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line-strong);box-shadow:0 8px 28px rgba(4,8,10,.5),inset 0 0 0 3px var(--panel-solid),inset 0 0 0 4px var(--line);padding:10px 16px 8px}
.playing #legend{display:none}
.playing #bottom{height:calc(var(--bottomH) - 28px)}
.pb-top{display:flex;align-items:center;gap:10px;font:600 13px var(--f-caps);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-hi)}

<script>

/* ---------- derived data ---------- */
const kids={};
Object.keys(P).forEach(id=>{P[id].id=id;if(P[id].parent){(kids[P[id].parent]=kids[P[id].parent]||[]).push(id)}});
const T1=new Set(['troy','ithaca','cyclopes','aeolia','laestrygonians','aeaea','hades','ogygia','scheria','lotus_eaters','crete','athens','egypt','ethiopia','sidon','cyprus','ismarus','libya','scylla','thrinacia','sparta','pylos','mycenae']);
const T3=new Set(['gyrae','dulichium','aegae','south_crete','temese','tenedos','meliboea','geraestus']);
const IMP={sparta:7,pylos:6,mycenae:5,crete:4,athens:3,egypt:2};
const tierZ=id=>T1.has(id)?-99:T3.has(id)?7.9:6.8;

/* land mask used to validate smoothed routes */
function maskFrom(polys,x0,y0,x1,y1,res){
  const w=Math.ceil((x1-x0)/res),h=Math.ceil((y1-y0)/res);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const c=cv.getContext('2d',{willReadFrequently:true});
  c.setTransform(1/res,0,0,-1/res,-x0/res,y1/res);
  const path=new Path2D();
  polys.forEach(poly=>poly.forEach(r=>{path.moveTo(r[0][0],r[0][1]);for(let i=1;i<r.length;i++)path.lineTo(r[i][0],r[i][1]);path.closePath()}));
  c.fillStyle='#000';c.fill(path,'evenodd');
  const d=c.getImageData(0,0,w,h).data,m=new Uint8Array(w*h);
  for(let i=0;i<m.length;i++)m[i]=d[i*4+3]>100?1:0;
  const dil=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(m[i]||m[i-1]||m[i+1]||m[i-w]||m[i+w]||m[i-w-1]||m[i-w+1]||m[i+w-1]||m[i+w+1])dil[i]=1}
  return {w,h,x0,y1,res,m,dil};

const MLOW=maskFrom(WORLD.land.low,BB[0],BB[1],BB[2],BB[3],.02);
const MHIGH=maskFrom(WORLD.land.high,HB[0],HB[1],HB[2],HB[3],.005);
function landAt(M,lon,lat,dil){
  const x=Math.floor((lon-M.x0)/M.res),y=Math.floor((M.y1-lat)/M.res);
  if(x<0||y<0||x>=M.w||y>=M.h)return false;
  return (dil?M.dil:M.m)[y*M.w+x]===1;
}
function onLand(lon,lat,dil){
  if(lon>=HB[0]&&lon<=HB[2]&&lat>=HB[1]&&lat<=HB[3])return landAt(MHIGH,lon,lat,dil);
  return landAt(MLOW,lon,lat,dil);
}
function lineClear(a,b,dil,ex){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),n=Math.max(1,Math.ceil(d/.012));
  for(let i=0;i<=n;i++){
    const t=i/n,off=t*d;
    if(dil&&(off<ex||d-off<ex))continue;
    if(onLand((a[0]+dx*t)/C37,-(a[1]+dy*t),dil))return false;

}
/* taut path between grid points, with rounded corners */
function smoothSea(pts){
  if(pts.length<4)return null;
  const Pp=pts.map(p=>[p[0]*C37,-p[1]]),n=Pp.length;
  const out=[Pp[0]];let i=0;
  while(i<n-1){
    let lo=i+1,step=1,j=i+1;
    while(true){
      const t=Math.min(n-1,i+step*2);
      if(t>j&&lineClear(Pp[i],Pp[t],true,.05)){j=t;lo=t;step*=2;if(t===n-1)break}else break;
    }
    // refine between j and the next step
    let hi=Math.min(n-1,i+step*2);
    while(hi-j>1){const mid=(j+hi)>>1;if(lineClear(Pp[i],Pp[mid],true,.05))j=mid;else hi=mid}
    out.push(Pp[j]);i=j;
  }
  let L=out;
  for(let it=0;it<4;it++){
    const o=[L[0]];
    for(let k=1;k<L.length-1;k++){
      const a=L[k-1],v=L[k],b=L[k+1];
      const p1=[.25*a[0]+.75*v[0],.25*a[1]+.75*v[1]],p2=[.75*v[0]+.25*b[0],.75*v[1]+.25*b[1]];
      if(lineClear(p1,p2,false,0))o.push(p1,p2);else o.push(v);
    }
    o.push(L[L.length-1]);L=o;
  }
  // two more passes on sharp corners only (angle > 30 degrees)
  for(const f of [.12,.06]){
    const o=[L[0]];
    for(let k=1;k<L.length-1;k++){
      const a=L[k-1],v=L[k],b=L[k+1];
      const a1=Math.atan2(v[1]-a[1],v[0]-a[0]),a2=Math.atan2(b[1]-v[1],b[0]-v[0]);
      let da=Math.abs(a2-a1);if(da>Math.PI)da=2*Math.PI-da;

        const p1=[(1-f)*v[0]+f*a[0],(1-f)*v[1]+f*a[1]],p2=[(1-f)*v[0]+f*b[0],(1-f)*v[1]+f*b[1]];
        if(lineClear(p1,p2,false,0)){o.push(p1,p2);continue}
      }
      o.push(v);
    }
    o.push(L[L.length-1]);L=o;
  }
  return L;
}
const ROUTESTAT={smoothed:0,fallback:0};
CH.forEach(c=>{
  c.color=COL[c.id]||'#ddd';c.tc=lum(c.color)>.62?'#17110a':'#fff';
  c.segs=[];c.km=0;

    let Pt=null;

    for(let i=0;i<n;i++){
      const x=Pt[i][0],y=Pt[i][1];xy[2*i]=x;xy[2*i+1]=y;
      if(i)cum[i]=cum[i-1]+Math.hypot(x-xy[2*i-2],y-xy[2*i-1]);

/* ---------- land geometry ---------- */
function edgeCode(p,bb){let c=0;if(Math.abs(p[0]-bb[0])<1e-3)c|=1;if(Math.abs(p[0]-bb[2])<1e-3)c|=2;if(Math.abs(p[1]-bb[1])<1e-3)c|=4;if(Math.abs(p[1]-bb[3])<1e-3)c|=8;return c}

        if(placed.ring>0)WIRES.push({x0:clamp(u.ax,placed.r.x,placed.r.x+w),y0:clamp(u.ay,placed.r.y,placed.r.y+h),x1:u.ax,y1:u.ay,color:c.d.ch.color});
        if(c.multi)c.members.forEach(m=>{if(Math.hypot(m.it.x-u.ax,m.it.y-u.ay)>3)WIRES.push({x0:u.ax,y0:u.ay,x1:m.it.x,y1:m.it.y,color:c.d.ch.color})});

  });
  Object.keys(pool).forEach(k=>{if(pool[k]._u!==FID)pool[k].hidden=true});
  // pins (DOM)
  items.forEach(it=>{
    const e=pinEl[it.id],l=lblEl[it.id];
    if(!it.show){if(!e.hidden)e.hidden=true;if(l._on!==0){l.className='lbl';l._cls='lbl';l._on=0}return}
    if(e.hidden)e.hidden=false;
    e.style.transform='translate('+it.x.toFixed(1)+'px,'+it.y.toFixed(1)+'px)';
    const cls='pin'+(it.id==='ithaca'?' ithaca'+(z>=9.5?' low':''):'')+(it.id==='ithaca_sight'&&z<7?' sm':'')+(sel===it.id?' sel':'')+(it.inC&&sel!==it.id?' cant':'')+(CAN&&!it.inC&&sel!==it.id?' dim':'')+(CAN&&CAN.places[0]===it.id?' first':'');
    if(e._cls!==cls){e.className=cls;e._cls=cls}
    e.style.zIndex=it.id==='ithaca'&&z>=9.5?1:Math.min(1000,Math.round(it.prio));
    if(!it._lab&&l._cls!=='lbl'){l.className='lbl';l._cls='lbl'}
    l._on=it._lab?1:0;

function updateScale(){
  const pxPerKm=V.k/111.2;let best=100;
  [5,10,20,50,100,200,500,1000,2000].forEach(v=>{if(v*pxPerKm<=130)best=v});
  $('#scale-t').textContent=best.toLocaleString('en-US')+' km';$('#scale-b').style.width=Math.round(best*pxPerKm)+'px';
}

/* ---------- frame loop ---------- */
function req(){if(!raf)raf=requestAnimationFrame(frame)}
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function frame(){
  raf=0;const now=performance.now();
  const dt=lastT?Math.min(.1,(now-lastT)/1000):.016;lastT=now;
  let more=false;
  if(tw){
    const u=clamp((now-tw.t0)/tw.dur,0,1),e=ease(u);
    V.cx=tw.cx0+(tw.cx1-tw.cx0)*e;V.cy=tw.cy0+(tw.cy1-tw.cy0)*e;
    V.k=Math.exp(tw.lk0+(tw.lk1-tw.lk0)*e-tw.dip*Math.sin(Math.PI*e));
    clampView();
    if(u>=1)tw=null;else more=true;
  }
  if(inertia){
    const t=now-inertia.t0,f=Math.exp(-t/260);
    V.cx-=inertia.vx*dt*f/V.k;V.cy-=inertia.vy*dt*f/V.k;clampView();
    if(f<.04)inertia=null;else more=true;
  }
  if(PL.state==='play'){tickPlay(dt);more=true}
  else if(PL.state!=='off'&&PL.phase==='move')more=true;
  const sig=V.cx+'|'+V.cy+'|'+V.k;if(sig!==lastSig){lastSig=sig;lastMove=now}
  const fast=now-lastMove<130;
  if(fast){clearTimeout(settleT);settleT=setTimeout(req,150)}
  const t0=performance.now();drawTerrain(fast);const t1=performance.now();
  updatePins();const t2=performance.now();
  drawOverlay();updateScale();const t3=performance.now();
  PERF.terrain=t1-t0;PERF.pins=t2-t1;PERF.overlay=t3-t2;
  lastT=more?now:0;
  if(more)req();
}

/* ---------- playback ---------- */
function legDur(seg){return REDUCE?.01:clamp(1.1+(seg?seg.km:0)/1100,1.1,3.2)}
function dwellDur(c,i){return REDUCE?2.2:clamp(1.5+(c.stops[i].note||'').length*.016,1.7,3.4)}
function legView(c,j){
  const a=P[c.stops[j-1].place],b=P[c.stops[j].place];
  const bothIthaca=(a.parent==='ithaca'||a.id==='ithaca')&&(b.parent==='ithaca'||b.id==='ithaca');
  const bb=boundsOf([[a.lon,a.lat],[b.lon,b.lat]]);
  const v=viewFor(bb[0],bb[1],bb[2],bb[3],{pad:50,maxZ:bothIthaca?12.5:7.6,minZ:5.2});
  // if the leg already fits at the current zoom, just pan
  const f=FR,mx=(bb[0]+bb[2])/2,my=(bb[1]+bb[3])/2;
  const wpx=(bb[2]-bb[0])*V.k,hpx=(bb[3]-bb[1])*V.k;
  if(wpx<f.w-100&&hpx<f.h-100&&V.k>=z2k(5.2)&&k2z(V.k)<=(bothIthaca?12.5:7.6)+.01){
    const fx=f.x+f.w/2,fy=f.y+f.h/2;
    return {k:V.k,cx:mx-(fx-W/2)/V.k,cy:my-(fy-H/2)/V.k};
  }
  return v;
}
function enterStop(i,fly){
  const c=chById[PL.id];PL.i=i;PL.phase='dwell';PL.t=0;PL.dur=dwellDur(c,i);PL.frac=1;
  if(fly!==false){
    if(i>0)go(legView(c,i),{dur:600});
    else{const p=P[c.stops[0].place];go(viewFor(p.lon*C37,-p.lat,p.lon*C37,-p.lat,{maxZ:7.6,minZ:5.2}),{dur:800})}
  }
  syncPlay();
}
function beginLeg(j){
  const c=chById[PL.id],seg=c.segs[j];
  if(!seg){enterStop(j);return}
  PL.phase='frame';PL.t=0;PL.dur=REDUCE?.01:.75;PL.frac=0;
  go(legView(c,j),{dur:700});
  syncPlay();
}
function routeView(id){
  const c=chById[id],pts=[];
  c.segs.forEach(s=>{if(s)for(let i=0;i<s.xy.length;i+=2)pts.push([s.xy[i]/C37,-s.xy[i+1]])});
  c.stops.forEach(s=>pts.push([P[s.place].lon,P[s.place].lat]));
  const b=boundsOf(pts);return viewFor(b[0],b[1],b[2],b[3],{pad:40,maxZ:10.6,minZ:5});
}
function tickPlay(dt){
  const c=chById[PL.id];if(!c)return;
  PL.t+=dt;
  if(PL.phase==='intro'){
    if(PL.t>=PL.dur){enterStop(PL.start||0)}
  }else if(PL.phase==='dwell'){
    if(PL.t>=PL.dur){
      if(PL.i>=c.stops.length-1){PL.state='done';syncPlay();return}
      beginLeg(PL.i+1);
    }
  }else if(PL.phase==='frame'){
    if(PL.t>=PL.dur){PL.phase='move';PL.t=0;PL.dur=legDur(c.segs[PL.i+1]);PL.frac=0}
  }else if(PL.phase==='move'){
    const u=clamp(PL.t/PL.dur,0,1);PL.frac=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    if(u>=1){enterStop(PL.i+1,false)}
  }
}
function play(id,start){
  const c=chById[id];if(!c)return;
  if(PL.id&&PL.id!==id)PL.state='off';
  soloActive(id);S.canto=null;
  S.focus=id;S.place=null;S.card=null;S.tab='route';S.hl=null;
  PL.id=id;PL.state='play';PL.start=clamp(start|0,0,c.stops.length-1);
  if(isMobile())S.sheet=false;
  syncAll();
  if(PL.start===0&&!REDUCE){
    PL.i=0;PL.phase='intro';PL.t=0;PL.dur=1.4;PL.frac=0;
    go(routeView(id),{dur:600});syncPlay();
  }else enterStop(PL.start);
  req();
}
function pause(){if(PL.state==='play'){PL.state='pause';syncPlay()}}
function resume(){
  if(PL.state==='pause'){PL.state='play';syncPlay();req()}
  else if(PL.state==='done'||PL.state==='off'){if(PL.id)play(PL.id,0)}
}
function stopPlay(){PL.state='off';PL.id=null;syncPlay();req()}
function seek(i){
  const c=chById[PL.id];if(!c)return;
  const was=PL.state;PL.state=was==='play'?'play':'pause';enterStop(clamp(i,0,c.stops.length-1));
}
function shipsRow(n,max){let h='';for(let i=1;i<=max;i++)h+=SHIP.replace('<svg ','<svg class="'+(i<=n?'on':'')+'" ');return h}
function syncPlay(){

    h+='<p class="eyebrow">Book '+c.roman+' of XXIV</p><h2 class="c">'+esc(c.title)+'</h2><p class="desc">'+esc(c.summary)+'</p>';
    if(S.canto>=9&&S.canto<=12)h+='<p class="gloss">Odysseus tells this episode to the Phaeacians, in flashback.</p>';
    h+='<h3>Places</h3><div class="chips">'+c.places.map(id=>'<button class="chip" data-act="place" data-id="'+id+'">'+smallPin(P[id].certainty)+esc(P[id].name)+'</button>').join('')+'</div>';
    h+='<h3>Characters</h3><div class="chips">'+c.chars.map(id=>chipChar(chById[id])).join('')+'</div>';
    h+='<div class="cnav"><button data-act="canto" data-n="'+(c.n-1)+'" data-go="1"'+(c.n<=1?' disabled':'')+'>'+(c.n>1?'← Book '+roman(c.n-1):'')+'</button><button data-act="canto" data-n="'+(c.n+1)+'" data-go="1"'+(c.n>=24?' disabled':'')+'>'+(c.n<24?'Book '+roman(c.n+1)+' →':'')+'</button></div>';
  }
  card.innerHTML=h;card.hidden=false;card.classList.remove('big');
  card.setAttribute('aria-label',S.card==='place'?P[S.place].name:'Book '+roman(S.canto)+': '+CA[S.canto-1].title);
  card.scrollTop=0;
}

/* ---------- book strip ---------- */
function buildStrip(){
  cantosEl.innerHTML=CA.map(c=>'<button class="cb" data-act="canto" data-n="'+c.n+'" aria-pressed="false" aria-label="Book '+c.roman+': '+esc(c.title)+'" title="'+esc(c.title)+'">'+c.roman+'</button>').join('');
}
function syncStrip(){
  const pc=S.place?P[S.place].cantos:null;
  $$('.cb').forEach(b=>{
    const n=+b.dataset.n;b.setAttribute('aria-pressed',S.canto===n?'true':'false');
    b.classList.toggle('has',!!pc&&pc.indexOf(n)>=0);
  });
  const a=$('.cb[aria-pressed=true]');
  if(a){const r=a.getBoundingClientRect(),pr=cantosEl.getBoundingClientRect();if(r.left<pr.left||r.right>pr.right)cantosEl.scrollLeft+=r.left-pr.left-pr.width/2+r.width/2}
}

/* ---------- search ---------- */
const SIDX=Object.keys(P).map(id=>{const p=P[id];return {t:'place',id,label:p.name,sub:p.modern+' · '+p.country,key:norm([p.name,p.alt_name||'',p.modern,p.country].join(' ')),cert:p.certainty}})
  .concat(CH.map(c=>({t:'char',id:c.id,label:c.name,sub:c.role,key:norm([c.name,c.alt_name||'',c.role].join(' ')),color:c.color})));
function doSearch(){
  const raw=$('#q').value,q=norm(raw.trim());
  $('#qclr').hidden=!raw;
  const sv=$('#v-search');
  if(!q){sv.innerHTML='';showView();return}
  const res=SIDX.filter(i=>i.key.indexOf(q)>=0).sort((a,b)=>(norm(a.label).indexOf(q)===0?0:1)-(norm(b.label).indexOf(q)===0?0:1)).slice(0,14);
  sv.innerHTML=res.length?res.map(r=>'<button data-act="'+(r.t==='place'?'place':'char')+'" data-id="'+r.id+'" data-from="search"><span class="ic">'+(r.t==='place'?PIN[r.cert]:'<i style="--c:'+r.color+'"></i>')+'</span><span><span class="rl">'+esc(r.label)+'</span><span class="rs">'+esc(r.sub)+'</span></span><span class="tag">'+(r.t==='place'?'Place':'Character')+'</span></button>').join(''):'<p class="empty">Nothing found for “'+esc(raw)+'”.</p>';
  showView();
}

/* ---------- global sync ---------- */
function showView(){
  const mob=isMobile();
  let t=S.tab;
  if(t==='route'&&!S.focus)t='chars';
  if(t==='legend'&&!mob)t='chars';
  if(t==='search'&&!mob)t='chars';
  const q=$('#q').value.trim();
  const searching=!!q||(mob&&t==='search');
  $('#v-chars').hidden=searching||t!=='chars';
  $('#v-route').hidden=searching||t!=='route';
  $('#v-legend').hidden=searching||t!=='legend';
  $('#v-search').hidden=!searching;
  $$('.tabs .tb').forEach(b=>{b.setAttribute('aria-selected',!searching&&b.dataset.tab===t?'true':'false');if(b.dataset.tab==='route')b.setAttribute('aria-disabled',S.focus?'false':'true')});
  $$('#dock button').forEach(b=>{
    const d=b.dataset.dock;
    const cur=mob&&t==='search'?'search':t;
    b.setAttribute('aria-pressed',S.sheet&&d===cur?'true':'false');
    if(d==='route')b.setAttribute('aria-disabled',S.focus?'false':'true');
  });
  $('#hideall').hidden=searching||t!=='chars';
  side.classList.toggle('tab-search',mob&&t==='search');
  side.classList.toggle('tab-route',t==='route'&&!searching);
  fadeCheck();
}
function syncAll(){
  buildCardIfChanged();
  syncChars();
  const rk=(S.focus||'')+'|'+isMobile();
  if(buildRoute.key!==rk)buildRoute();
  syncRoute();syncStrip();showView();
  side.classList.toggle('open',S.sheet);
  app.classList.toggle('sheet-open',S.sheet&&isMobile());
  app.classList.toggle('card-open',!!S.card);
  freeRect();
  req();
}
let cardKey='';
function buildCardIfChanged(){
  const k=S.card+'|'+S.place+'|'+S.canto;
  if(k!==cardKey){cardKey=k;buildCard()}
}
function fadeEl(el){el.classList.toggle('more-below',el.scrollHeight-el.scrollTop-el.clientHeight>6)}
function fadeCheck(){requestAnimationFrame(()=>{fadeEl($('#pbody'));if(!card.hidden)fadeEl(card)})}
$('#pbody').addEventListener('scroll',()=>fadeEl($('#pbody')));
card.addEventListener('scroll',()=>fadeEl(card));

/* ---------- public actions ---------- */
function soloActive(id){
  S.active=S.active.filter(x=>S.pinned.indexOf(x)>=0&&x!==id);
  S.active.push(id);
}
function selectCharacter(id,o){
  const c=chById[id];if(!c)return;
  if(PL.state!=='off'&&PL.id!==id)stopPlay();
  soloActive(id);S.canto=null;
  S.focus=id;S.place=null;S.card=null;S.tab='route';S.hl=null;
  if(isMobile())S.sheet=true;
  syncAll();
  const v=routeView(id);go(v,o);
}
function toggleChar(id){
  const i=S.active.indexOf(id);
  S.canto=null;if(S.card==='canto')S.card=null;
  if(i>=0){S.active.splice(i,1);if(S.focus===id){S.focus=null;if(S.tab==='route')S.tab='chars'}if(PL.id===id)stopPlay()}
  else{S.active.push(id);S.pinned.push(id)}
  const pi=S.pinned.indexOf(id);if(i>=0&&pi>=0)S.pinned.splice(pi,1);
  syncAll();
}
function placePoints(id){
  const p=P[id],pts=[[p.lon,p.lat]];
  (kids[id]||[]).forEach(k=>pts.push([P[k].lon,P[k].lat]));
  (p.alts||[]).forEach(a=>pts.push([a.lon,a.lat]));
  return pts;
}
function selectPlace(id,o){
  if(!id){S.place=null;S.card=S.canto?'canto':null;syncAll();return}
  const p=P[id];if(!p)return;
  S.place=id;S.card='place';S.hl=null;
  if(isMobile())S.sheet=false;
  $('#q').blur();
  syncAll();
  const pts=placePoints(id),multi=pts.length>1;
  const isIthaca=id==='ithaca';
  fitPts(pts,Object.assign({pad:40,maxZ:multi?11.4:(p.parent?12.4:8.7),minZ:isIthaca?10.2:multi?5:(p.parent?12.4:8.7)},o||{}));
}
function selectCanto(n,o){
  if(n==null||n<1||n>24){S.canto=null;if(S.card==='canto')S.card=S.place?'place':null;syncAll();return}
  S.canto=n;S.place=null;S.card='canto';S.hl=null;
  if(isMobile())S.sheet=false;
  syncAll();
  const cn=CA[n-1],pts=[];
  const main=chById[cn.chars[0]];
  if(main){
    main.stops.forEach((s,i)=>{
      if((s.cantos||[]).indexOf(n)<0)return;
      pts.push([P[s.place].lon,P[s.place].lat]);
      const sg=main.segs[i];if(sg)for(let k=0;k<sg.xy.length;k+=2)pts.push([sg.xy[k]/C37,-sg.xy[k+1]]);
    });
  }
  if(!pts.length)cn.places.forEach(id=>pts.push([P[id].lon,P[id].lat]));
  fitPts(pts,Object.assign({pad:50,maxZ:10.8,minZ:5},o||{}));
}
function flyTo(lat,lon,zoom,o){
  const f=freeRect(),k=clamp(z2k(zoom==null?8:zoom),minK(),z2k(MAXZ));
  const X=lon*C37,Y=-lat,fx=f.x+f.w/2,fy=f.y+f.h/2;
  go({k,cx:X-(fx-W/2)/k,cy:Y-(fy-H/2)/k},o);
}
function reset(){
  S.active=['odysseus'];S.pinned=[];S.focus='odysseus';S.place=null;S.canto=null;S.card=null;S.tab='chars';S.hl=null;
  stopPlay();syncAll();go(homeView(),{});touched=false;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'char':selectCharacter(id);if(t.dataset.from==='search')clearSearch();break;
    case 'toggle':toggleChar(id);break;
    case 'place':if(t.dataset.from==='search')clearSearch();selectPlace(id);break;
    case 'canto':{
      const n=+t.dataset.n;
      if(t.dataset.go||t.dataset.keep)selectCanto(n);
      else selectCanto(S.canto===n&&S.card==='canto'?null:n);
      break}
    case 'closecard':if(S.card==='place'){S.place=null;S.card=S.canto?'canto':null}else{S.card=null;S.canto=null}syncAll();break;
    case 'cardbig':card.classList.toggle('big');setTimeout(()=>{freeRect();req()},230);break;
    case 'closesheet':S.sheet=false;syncAll();break;
    case 'hideall':S.active=[];S.pinned=[];S.focus=null;S.hl=null;if(S.tab==='route')S.tab='chars';stopPlay();syncAll();break;
    case 'stop':{const c=chById[id],i=+t.dataset.i;S.hl={id,i};selectPlace(c.stops[i].place);break}
    case 'play':play(id,0);break;
    case 'ptoggle':if(PL.state==='play')pause();else resume();break;
    case 'pprev':seek(PL.i-1);break;
    case 'pnext':seek(PL.i+1);break;
    case 'stopplay':stopPlay();break;
    case 'zin':touched=true;zoomAt(W/2,H/2,1.7);break;
    case 'zout':touched=true;zoomAt(W/2,H/2,1/1.7);break;
    case 'home':touched=false;go(homeView(),{});break;
    case 'alt':{const al=P[S.place].alts[+t.dataset.i];flyTo(al.lat,al.lon,11);break}
    case 'badge':{
      if(t.dataset.fit){fitPts(t.dataset.fit.split(';').map(s=>s.split(',').map(Number).reverse().reverse()),{pad:70,maxZ:9.6,minZ:7.2});break}
      const pl=t.dataset.pl;if(pl)selectPlace(pl);break}
  }
});
function clearSearch(){$('#q').value='';doSearch()}
document.addEventListener('click',e=>{const t=e.target.closest('.pin');if(t)selectPlace(t.dataset.id)});
// highlight the leg arriving at the stop
const routeV=$('#v-route');
function hlFrom(e,on){
  const b=e.target.closest&&e.target.closest('.stop');if(!b)return;
  S.hl=on?{id:b.dataset.id,i:+b.dataset.i}:null;req();
}
routeV.addEventListener('mouseover',e=>hlFrom(e,true));
routeV.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.stop'))hlFrom(e,false)});
routeV.addEventListener('focusin',e=>hlFrom(e,true));
routeV.addEventListener('focusout',e=>hlFrom(e,false));
$$('.tabs .tb').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.tab==='route'&&!S.focus)return;
  clearSearchSilent();S.tab=b.dataset.tab;showView();
}));
function clearSearchSilent(){if($('#q').value){$('#q').value='';$('#qclr').hidden=true;$('#v-search').innerHTML=''}}
$$('#dock button').forEach(b=>b.addEventListener('click',()=>{
  const d=b.dataset.dock;
  if(d==='route'&&!S.focus)return;
  if(S.sheet&&S.tab===d){S.sheet=false}
  else{S.sheet=true;S.tab=d;if(d!=='search')clearSearchSilent()}
  if(S.sheet&&S.card){S.card=null;S.place=null}
  syncAll();
  if(S.sheet&&d==='search')$('#q').focus();
}));
$('#q').addEventListener('input',doSearch);
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const f=$('#v-search button');if(f)f.click()}
  if(e.key==='Escape'){clearSearch();e.stopPropagation()}
});
$('#qclr').addEventListener('click',()=>{clearSearch();$('#q').focus()});
document.addEventListener('input',e=>{if(e.target.id==='pscrub'){seek(+e.target.value)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.card){if(S.card==='place'){S.place=null;S.card=S.canto?'canto':null}else{S.card=null;S.canto=null}syncAll()}
    else if(S.sheet){S.sheet=false;syncAll()}
  }
});

/* ---------- gestures ---------- */
const ptrs=new Map();let drag=null,moved=false,pinch=null,lastTap=0;
mapEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  tw=null;inertia=null;
  if(ptrs.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),vx:0,vy:0,cap:false};moved=false}
  else if(ptrs.size===2){
    const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};moved=true;drag=null;
  }
});
mapEl.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;
  const r=mapEl.getBoundingClientRect();
  if(pinch&&ptrs.size>=2){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;
    zoomAt(mx-r.left,my-r.top,d/pinch.d);
    V.cx-=(mx-pinch.mx)/V.k;V.cy-=(my-pinch.my)/V.k;clampView();
    pinch.d=d;pinch.mx=mx;pinch.my=my;touched=true;req();return;
  }
  if(drag&&drag.id===e.pointerId){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6){moved=true;try{mapEl.setPointerCapture(e.pointerId);drag.cap=true}catch(_){}mapEl.classList.add('grabbing')}
    if(moved){
      const now=performance.now(),dtm=Math.max(1,now-drag.t);
      drag.vx=.6*drag.vx+.4*(dx/dtm*1000);drag.vy=.6*drag.vy+.4*(dy/dtm*1000);
      drag.t=now;V.cx-=dx/V.k;V.cy-=dy/V.k;drag.x=e.clientX;drag.y=e.clientY;touched=true;clampView();req();
    }
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(drag&&drag.id===e.pointerId){
    if(moved&&!REDUCE&&e.type==='pointerup'){
      const sp=Math.hypot(drag.vx,drag.vy);
      if(sp>180&&performance.now()-drag.t<90){inertia={t0:performance.now(),vx:drag.vx,vy:drag.vy};req()}
    }
    drag=null;mapEl.classList.remove('grabbing');
  }
  if(ptrs.size===0)setTimeout(()=>{moved=false},0);
}
mapEl.addEventListener('pointerup',endPtr);mapEl.addEventListener('pointercancel',endPtr);
mapEl.addEventListener('click',e=>{
  if(moved)return;
  if(e.target.closest('.pin,.bdg,.apin'))return;
  const now=performance.now();
  if(now-lastTap<320){const r=mapEl.getBoundingClientRect();touched=true;zoomAt(e.clientX-r.left,e.clientY-r.top,1.9);lastTap=0;return}
  lastTap=now;
  let ch=false;
  if(S.sheet&&isMobile()){S.sheet=false;ch=true}
  if(S.card==='place'){S.place=null;S.card=S.canto?'canto':null;ch=true}
  if(S.hl){S.hl=null;ch=true}
  if(ch)syncAll();
});
mapEl.addEventListener('dblclick',e=>e.preventDefault());
mapEl.addEventListener('wheel',e=>{
  e.preventDefault();tw=null;inertia=null;touched=true;
  let dy=e.deltaY;if(e.deltaMode===1)dy*=33;else if(e.deltaMode===2)dy*=300;
  const r=mapEl.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-dy*(e.ctrlKey?.012:.0016)));
},{passive:false});
mapEl.addEventListener('keydown',e=>{
  const step=90;let h=true;touched=true;
  switch(e.key){
    case 'ArrowLeft':V.cx-=step/V.k;break;
    case 'ArrowRight':V.cx+=step/V.k;break;
    case 'ArrowUp':V.cy-=step/V.k;break;
    case 'ArrowDown':V.cy+=step/V.k;break;
    case '+':case '=':zoomAt(W/2,H/2,1.5);break;
    case '-':case '_':zoomAt(W/2,H/2,1/1.5);break;
    default:h=false;
  }
  if(h){e.preventDefault();clampView();req()}
});

/* ---------- init ---------- */
buildChars();buildStrip();
legendEl.innerHTML=legendHTML();$('#v-legend').innerHTML='<div class="lg">'+legendHTML()+'</div>';
new ResizeObserver(()=>{resize();syncAll()}).observe(app);
resize();
{const h0=homeView();V.cx=h0.cx;V.cy=h0.cy;V.k=h0.k;homeZ=k2z(V.k)}
syncAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{Object.keys(mcache).forEach(k=>delete mcache[k]);req()});

window.__map={
  selectCharacter:(id,o)=>selectCharacter(id,o),
  selectPlace:(id,o)=>selectPlace(id,o),
  selectCanto:(n,o)=>selectCanto(n,o),
  flyTo:(lat,lon,zoom,o)=>flyTo(lat,lon,zoom,o),
  play:(id,start)=>play(id,start),
  pause:()=>pause(),
  resume:()=>resume(),
  seek:i=>seek(i),
  toggleCharacter:id=>toggleChar(id),
  reset:()=>reset(),
  perf:()=>PERF,
  routeStats:()=>ROUTESTAT,
  state:()=>JSON.parse(JSON.stringify({active:S.active,focus:S.focus,place:S.place,canto:S.canto,card:S.card,zoom:+zoomNow().toFixed(2),center:{lat:-V.cy,lon:V.cx/C37},play:{id:PL.id,state:PL.state,stop:PL.i,phase:PL.phase}}))
};
})();
</script>
